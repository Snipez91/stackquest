# Render Blueprint: one web service (HTTPS on *.onrender.com) + managed Postgres.
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Invite links use RENDER_EXTERNAL_URL unless APP_URL is set (e.g. for a custom domain).
services:
  - type: web
    name: stackquest
    runtime: docker
    plan: free # sleeps after 15 min idle; use starter for always-on
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stackquest-db
          property: connectionString
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_SSL
        value: "false" # Render's internal connection string is on the private network

databases:
  - name: stackquest-db
    plan: free # deleted 30 days after creation; use basic-256mb to keep data
    databaseName: stackquest
